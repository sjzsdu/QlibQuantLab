[project]
name = "qqlab-backend"
version = "0.1.0"
description = "QlibQuantLab backend — quant research API and task worker (research tooling only, no investment advice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "redis>=5.0,<9",
    "aio-pika>=9.5,<10",
    "boto3>=1.35,<2",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Qlib 在线模式客户端依赖（阶段 3 决策 #5：worker 基座锁 Python 3.11 ——
# pyqlib 0.9.7 在 cp312 的 tables/lightgbm wheel 不保证齐全，3.11 一次到位）。
# 版本矩阵（docs/stage1/06 §2）：client 端 socketio 4.x/3.x 上限，与 server 端
# 4.4.0/3.11.2 同代际（Engine.IO v3）；阶段 3 实测结论回写 06 文档 §8。
qlib = [
    "pyqlib==0.9.7",
    "python-socketio==4.6.1",
    "python-engineio==3.14.2",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
    # 单测直接覆盖 worker 侧 pandas 计算口径（如 _daily_ic 的日期分组，见
    # docs/stage5/05-testing.md §4 实机回归）。只进开发 venv：容器 `--no-dev`
    # 且不带 `--extra dev`，API/worker 运行时不受影响（worker 走 `--extra qlib`）。
    # 上界对齐 uv.lock 中 qlib extra 的解析（pyqlib 对 pandas 无约束 → 锁定 worker
    # 实机在跑的同一版本，避免 dev 与 worker 两套 pandas 语义）。
    "pandas>=2.2",
]

[project.scripts]
qqlab-worker = "qqlab.worker.main:main"
qqlab-api = "qqlab.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqlab"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 架构边界：只有 adapters / container / worker.qlib_env 可以碰具体 SDK
"src/qqlab/adapters/**" = ["E402"]
# FastAPI 的标准写法：Depends / Query / Path 出现在参数默认值里是官方推荐形态
"src/qqlab/api/**" = ["B008"]
