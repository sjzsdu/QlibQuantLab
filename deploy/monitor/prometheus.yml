# QlibQuantLab Prometheus 配置（阶段 8 · D8-7，docker compose --profile monitor）
#
# 抓取面：
#   - qqlab-backend：GET /api/v1/metrics（dev/test 免鉴权；生产需 METRICS_TOKEN，
#     用 authorization 配置 —— 演练/生产同款见 prometheus.rehearsal.yml）
#   - prometheus 自身
# 告警：规则 rules.yml（五条）→ Alertmanager（alerting 段）→ notify-bridge webhook
#       → 通道扇出（阶段 9 · D 项，接口+配置驱动，见 alertmanager.yml 头注释）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: qqlab-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
