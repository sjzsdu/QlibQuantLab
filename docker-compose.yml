# docker-compose.yml —— 模式 A：一键起全套依赖（不含 Traefik；Casdoor 走 --profile casdoor）
#
#   cp .env.example .env
#   docker compose up -d --build      # 默认 8 个服务：frontend backend worker migrate postgres redis rabbitmq
#
# 应用层完全不感知反向代理：本文件里没有 Traefik，也不引用任何外部网络。
# 三个可选 profile：
#   --profile minio   对象存储 MinIO（当前环境拉不到镜像，默认用 STORAGE_BACKEND=local 兜底）
#   --profile qlib    Qlib-Server + rabbitmq-init（vhost 授权）+ qlib-bootstrap（数据导入）
#                     （决策 #1：qlib 链路保持 opt-in，绝不进默认 up）
#   --profile casdoor Casdoor IdP（阶段 7；AUTH_PROVIDER=casdoor 时才需要，默认 mock 不起）

name: qqlab

# 后端/worker/迁移共用同一镜像与同一份 .env，只有 command 不同
x-backend: &backend
  build:
    context: ./backend
    target: ${DOCKER_TARGET:-dev}
  env_file: [.env]
  networks: [qqlab]
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- 前端
  frontend:
    build:
      context: ./frontend
      target: dev
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["${HOST_PORT_WEB:-3000}:3000"]
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: /api
    depends_on:
      backend: {condition: service_healthy}
    networks: [qqlab]
    restart: unless-stopped

  # ---------------------------------------------------------------- 后端 API（不 import qlib）
  backend:
    <<: *backend
    command: uvicorn qqlab.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - objects_data:/data/objects # STORAGE_BACKEND=local 时的对象数据，重建容器不丢
      - ./scripts:/scripts:ro # 阶段 3：入队 smoke 脚本在容器内执行（走 compose 内网）
      - qlib_data:/qlib_data:ro # 阶段 4：数据集预览（纯标准库 bin 解析，不 import qlib；只读）
    ports: ["${HOST_PORT_API:-8000}:8000"]
    environment:
      IS_WORKER: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------- 任务 worker（唯一 import qlib 的进程）
  # 阶段 3：注册 dataset_import / backtest handler（train 在阶段 5）；
  # qlib 是进程单例 → QLIB_WORKER_CONCURRENCY=1（.env 里设定）。
  # 镜像链独立（dev-worker / worker-runtime，Python 3.11 + qlib extra），
  # venv 卷也与 API 分开（worker_venv 是 3.11，backend_venv 是 3.12，绝不共用）。
  # platform 锁 amd64：pyqlib 0.9.7 只发布了 manylinux2014_x86_64 wheel（无 arm64、无 sdist），
  # Apple Silicon 上必须走 Rosetta 构建与运行（与 qlib-server 同一约束）。
  # 不写 depends_on qlib-server：qlib 在 opt-in profile 里，默认 up 不启动它；
  # COMPUTE_BACKEND=stub（默认）不触网，COMPUTE_BACKEND=qlib 时连接失败会显式报错。
  worker:
    build:
      context: ./backend
      target: ${WORKER_DOCKER_TARGET:-dev-worker}
    platform: ${WORKER_PLATFORM:-linux/amd64}
    command: qqlab-worker
    env_file: [.env]
    environment:
      IS_WORKER: "true"
    networks: [qqlab]
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
      - qlib_data:/qlib_data
      - experiments:/experiments
      - objects_data:/data/objects # 阶段 3 起 worker 也可能落对象（与 backend 共用）
      - ./scripts:/scripts:ro # 阶段 3：连通性 smoke 在 worker 容器内跑（有 socketio）
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # ---------------------------------------------------------------- 一次性数据库迁移
  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    # 与 backend 一致挂载工作树：dev 下迁移必须跟 alembic/versions 同步，
    # 否则跑的是镜像烤入的旧 revision（实测：DB 已到 0003 而镜像只认 0001/0002 → "Can't locate revision"）
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres: {condition: service_healthy}

  # ---------------------------------------------------------------- Qlib 在线服务（硬依赖 Redis + RabbitMQ）
  # 阶段 3 交付 ./qlib-server 构建上下文后启用；默认 profile 不启动，避免阶段 2 构建失败。
  qlib-server:
    profiles: ["qlib"]
    # 与 qlib-bootstrap 共享同一镜像（同一 build context / runtime stage），
    # 避免 compose 按服务名派生出两个独立镜像导致重复 pip install（撞 PyPI 抖动）。
    image: qqlab-qlib-server:latest
    build:
      context: ./qlib-server
    platform: ${QLIB_SERVER_PLATFORM:-linux/amd64} # Apple Silicon 走 Rosetta；arm64 自建镜像后置空
    env_file: [.env]
    environment:
      QUEUE_HOST: ${QLIB_SERVER_QUEUE_HOST:-rabbitmq}
      QUEUE_USER: ${RABBITMQ_DEFAULT_USER}
      QUEUE_PASS: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: ${QLIB_SERVER_REDIS_HOST:-redis}
      REDIS_PORT: ${QLIB_SERVER_REDIS_PORT:-6379}
      REDIS_DB: ${QLIB_SERVER_REDIS_DB:-0}
      MESSAGE_QUEUE: ${QLIB_SERVER_MESSAGE_QUEUE:-message_queue}
      TASK_QUEUE: ${QLIB_SERVER_TASK_QUEUE:-task_queue}
      FLASK_SERVER_HOST: 0.0.0.0
      # provider_uri 必须指向 dump_bin 根（含 calendars/instruments/features）——
      # 即 {org 目录}/cn_data，与 worker 的 data_dir_for() 完全一致，否则 D.features 取不到数
      QLIB_DATA: /qlib_data/${MOCK_ORG_ID:-dev-org}/cn_data
      REGION: ${QLIB_REGION:-cn}
    volumes:
      - qlib_data:/qlib_data
    ports: ["${HOST_PORT_QLIB:-9710}:9710"]
    networks: [qqlab]
    depends_on:
      rabbitmq: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;socket.create_connection(('127.0.0.1',9710),3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # 一次性数据导入（Yahoo 下载 → dump_bin），阶段 3 交付脚本后可用：
  #   docker compose --profile qlib run --rm qlib-bootstrap
  qlib-bootstrap:
    profiles: ["qlib"]
    # 复用 qlib-server 镜像（同一 build context），不单独构建；只需它自带的 pyqlib 去跑 GetData
    image: qqlab-qlib-server:latest
    platform: ${QLIB_SERVER_PLATFORM:-linux/amd64}
    env_file: [.env]
    # 镜像 ENTRYPOINT 是 main.py（qlib-server），跑 bootstrap 必须覆盖 entrypoint
    entrypoint: ["bash", "/scripts/bootstrap_qlib_data.sh"]
    command: []
    volumes:
      - qlib_data:/qlib_data
      - ./scripts:/scripts:ro
    networks: [qqlab]
    restart: "no"

  # 一次性授权：RABBITMQ_DEFAULT_VHOST=/qqlab（应用自己的队列），vhost / 默认不存在，
  # 而 vendored Qlib-Server 的 pika 连接硬编码默认 vhost /（utils.py 不支持 vhost 参数）。
  # 不改官方实现（vendored 源码保持与上游一致），用这条一次性授权补齐（阶段 3 决策）：
  #   PUT /api/vhosts/%2F（创建 /，幂等）→ PUT /api/permissions/%2F/{user} → GET 验证。
  # 走 management HTTP API 而非 rabbitmqctl：跨容器 rabbitmqctl 因 Erlang cookie/nodename
  # 无法连接（实测 exit 69）；API 路径用同镜像自带 python3，不引入新镜像。
  # 幂等：重复执行无副作用；rabbitmq-init 完成后 qlib-server 才启动。
  rabbitmq-init:
    profiles: ["qlib"]
    image: rabbitmq:3.13-management-alpine
    depends_on:
      rabbitmq: {condition: service_healthy}
    environment:
      MQ_USER: ${RABBITMQ_DEFAULT_USER}
      MQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      MQ_MGMT: http://rabbitmq:15672
    command:
      - sh
      - -c
      - |
        python3 - <<'PY'
        import base64, json, os, time, urllib.error, urllib.parse, urllib.request

        user = os.environ["MQ_USER"]
        pw = os.environ["MQ_PASS"]
        base = os.environ.get("MQ_MGMT", "http://rabbitmq:15672")
        auth = "Basic " + base64.b64encode(f"{user}:{pw}".encode()).decode()

        def call(method, path, body=None):
            req = urllib.request.Request(
                base + path,
                method=method,
                data=json.dumps(body).encode() if body is not None else None,
                headers={"Content-Type": "application/json", "Authorization": auth},
            )
            with urllib.request.urlopen(req, timeout=5) as resp:
                return resp.status

        quser = urllib.parse.quote(user, safe="")
        last = None
        for i in range(30):
            try:
                print("create vhost / ->", call("PUT", "/api/vhosts/%2F", {}))
                print("grant on / ->", call(
                    "PUT", f"/api/permissions/%2F/{quser}",
                    {"configure": ".*", "write": ".*", "read": ".*"},
                ))
                print("verify ->", call("GET", f"/api/permissions/%2F/{quser}"))
                raise SystemExit(0)
            except SystemExit:
                raise
            except (urllib.error.URLError, OSError, TimeoutError) as exc:
                last = exc
                print(f"retry {i}: {exc}")
                time.sleep(2)
        raise SystemExit(f"rabbitmq-init failed: cannot grant vhost / permissions: {last}")
        PY
    networks: [qqlab]
    restart: "no"

  # ---------------------------------------------------------------- 基础设施（模式 A）
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg_data:/var/lib/postgresql/data]
    # 宿主端口只绑回环；默认避开本机已有的 5432，可用 HOST_PORT_PG 覆盖。容器内恒为 postgres:5432。
    ports: ["127.0.0.1:${HOST_PORT_PG:-5433}:5432"]
    networks: [qqlab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 应用缓存 + Qlib-Server 硬依赖共用一个实例（分 db 隔离：应用 db5 / Qlib-Server db0）。
  # 刻意不设密码：Qlib-Server 官方实现不支持 Redis 密码（阶段 1 风险 R11），
  # 靠 Docker 内网 + 宿主端口只绑回环保护。模式 B 建议两者分开实例。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    # 宿主端口只绑回环；默认避开本机已有的 6379，可用 HOST_PORT_REDIS 覆盖。容器内恒为 redis:6379。
    ports: ["127.0.0.1:${HOST_PORT_REDIS:-16379}:6379"]
    networks: [qqlab]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # 应用默认 vhost = /qqlab（与 MQ_URL 的 %2Fqqlab 对齐）。
      # 阶段 3 注意：默认用户只在默认 vhost 上有权限，而 Qlib-Server 用的是 /，
      # 启用 qlib profile 时需要补一条授权：
      #   docker compose exec rabbitmq rabbitmqctl set_permissions -p / qqlab '.*' '.*' '.*'
      RABBITMQ_DEFAULT_VHOST: /qqlab
    volumes: [rabbit_data:/var/lib/rabbitmq]
    ports: ["${HOST_PORT_AMQP:-5672}:5672", "${HOST_PORT_AMQP_MGMT:-15672}:15672"]
    networks: [qqlab]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # 对象存储 MinIO：挂到 `minio` profile，默认 up 不启动（当前环境无可用 minio 镜像源，
  # 核心链路用 STORAGE_BACKEND=local 兜底）。镜像源恢复后：
  #   .env 改 STORAGE_BACKEND=minio → docker compose --profile minio up -d minio
  # 注意：minio 服务必须显式挂 qqlab 网络，否则 backend 解析不到 minio 主机名。
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    ports: ["${HOST_PORT_S3:-9000}:9000", "${HOST_PORT_S3_CONSOLE:-9001}:9001"]
    networks: [qqlab]
    restart: unless-stopped
    # 故意不写 healthcheck：minio 官方镜像内既无 mc 也无 curl，写死命令只会永远 unhealthy。
    # 验证方式（宿主机）：curl -sf http://localhost:9000/minio/health/live
    # bucket 由 backend 的 S3StorageProvider.ping() 惰性创建（head_bucket → create_bucket），
    # 因此不再需要独立的 minio/mc 初始化容器（该镜像已从 Docker Hub 移除）。

  # ---------------------------------------------------------------- Casdoor（阶段 7 · OIDC IdP）
  # mock 认证（阶段 1-6 默认）不需要 IdP；切 AUTH_PROVIDER=casdoor 时启动：
  #   docker compose --profile casdoor up -d casdoor
  # all-in-one = 单二进制 + 内嵌 SQLite（官方定位 quick try-out）→ 仅限开发/冒烟，
  # 数据落 casdoor_data 卷（重启持久）；卷清空重建时启动自动重放挂载的 init_data.json（幂等 create+update）。
  # 生产用 casbin/casdoor + 外部 PostgreSQL，见 docs/stage7/05-casdoor-deployment.md。
  # 镜像必须按 digest 拉取（镜像源 tag + --platform 会被本地单架构缓存骗架构，阶段 6/7 实测）：
  #   curl -s "https://docker.1ms.run/openapi/v1/auth/token?service=docker.1ms.run&scope=repository:casbin/casdoor-all-in-one:pull"
  #   → Bearer 后 GET /v2/casbin/casdoor-all-in-one/manifests/latest 取目标架构 digest
  #   → docker pull docker.1ms.run/casbin/casdoor-all-in-one@sha256:<digest> && docker tag … casbin/casdoor-all-in-one:latest
  # 当前栈架构 digest（2026-10-18 探测）：amd64 sha256:ba602519188c5f5c31e77efa5b7b53dcc758bb3625122dd6e33ac5ef25c4772e
  casdoor:
    profiles: ["casdoor"]
    image: casbin/casdoor-all-in-one:latest
    platform: ${CASDOOR_PLATFORM:-linux/amd64} # 与本栈一致；Apple Silicon 走 Rosetta
    ports: ["${HOST_PORT_CASDOOR:-8001}:8000"]
    networks: [qqlab]
    restart: unless-stopped
    # 官方镜像内置 sqlite + bash/curl；entrypoint 脚本支持 env 覆盖数据源
    environment:
      driverName: sqlite
      dataSourceName: "file:/data/casdoor.db?cache=shared"
    volumes:
      - casdoor_data:/data
      # 声明式种子（幂等，initDataNewOnly=false：新建+更新）：组织/应用/角色/测试用户
      - ./deploy/casdoor/init_data.json:/init_data.json:ro
    healthcheck:
      # 镜像内有 curl（无 wget）；discovery 是本栈真正依赖的活性信号
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/.well-known/openid-configuration",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  # 阶段 8 · D8-7：监控 profile —— Prometheus 抓 backend 的 /api/v1/metrics
  # （RED/队列/worker 三分指标见 docs/stage8/03-observability-and-platform-audit.md）。
  # Alertmanager/Grafana 不内置（范围外，接入企业告警渠道归运维）；
  # 规则样例 deploy/monitor/rules.yml，起停：docker compose --profile monitor up -d prometheus
  prometheus:
    profiles: ["monitor"]
    # quay.io 为 Prometheus 官方自带镜像源（与 docker.io 同 tag）；升级看 https://github.com/prometheus/prometheus/releases
    image: quay.io/prometheus/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitor/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:${HOST_PORT_PROMETHEUS:-9090}:9090"]
    networks: [qqlab]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  # ---------------------------------------------------------------- 告警链（阶段 9 · D 项）
  # 链路：rules.yml（五条，阶段 8）→ Alertmanager（分组/抑制/静默）→ notify-bridge
  #       → 通道扇出（企业微信/钉钉/飞书/邮件 —— 启用哪些纯看下面的 env 配置，留空则只落
  #       本地 sink 留档）。生产形态的同套组件（带 METRICS_TOKEN 抓取）在演练栈里，
  #       见 deploy/rehearsal/docker-compose.prod-rehearsal.yml。
  alertmanager:
    profiles: ["monitor"]
    image: quay.io/prometheus/alertmanager:v0.29.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/monitor/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["127.0.0.1:${HOST_PORT_ALERTMANAGER:-9093}:9093"]
    networks: [qqlab]
    depends_on:
      notify-bridge: {condition: service_healthy}
    restart: unless-stopped

  notify-bridge:
    profiles: ["monitor"]
    # 纯 stdlib 单文件（deploy/monitor/notify_bridge.py），跑在 python 基础镜像里 —— 零新依赖
    image: python:3.12-slim
    command: ["python3", "/app/notify_bridge.py"]
    environment: # 启用哪些通道纯配置；全部留空 = 只落 sink 留档（本地回执）
      NOTIFY_SINK_DIR: /var/lib/qqlab-notify/sink
      NOTIFY_WECOM_URL: ${NOTIFY_WECOM_URL:-}
      NOTIFY_DINGTALK_URL: ${NOTIFY_DINGTALK_URL:-}
      NOTIFY_DINGTALK_SECRET: ${NOTIFY_DINGTALK_SECRET:-}
      NOTIFY_FEISHU_URL: ${NOTIFY_FEISHU_URL:-}
      NOTIFY_EMAIL_HOST: ${NOTIFY_EMAIL_HOST:-}
      NOTIFY_EMAIL_PORT: ${NOTIFY_EMAIL_PORT:-587}
      NOTIFY_EMAIL_USER: ${NOTIFY_EMAIL_USER:-}
      NOTIFY_EMAIL_PASSWORD: ${NOTIFY_EMAIL_PASSWORD:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
    volumes:
      - ./deploy/monitor/notify_bridge.py:/app/notify_bridge.py:ro
      - notify_sink:/var/lib/qqlab-notify/sink
    ports: ["127.0.0.1:${HOST_PORT_NOTIFY_BRIDGE:-9094}:9099"]
    networks: [qqlab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9099/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    profiles: ["monitor"]
    image: grafana/grafana:12.0.2 # docker.io 官方源（quay 镜像仓为空）；数据源/看板供给不入库外文件
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-qqlab-grafana-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${HOST_PORT_GRAFANA:-3100}:3000"]
    networks: [qqlab]
    restart: unless-stopped

  # 阶段 8 · D 项（D8-8）：一次性备份/恢复，挂 --profile backup。
  # 范围 = postgres（业务真源：org/用户/项目/因子/任务/审计/平台审计）。
  #   · objects/minio（导出物）与 qlib_data（可经 bootstrap 再导入）不在范围，理由见
  #     docs/stage8/04-operations-and-rehearsals.md；
  #   · 用法（scripts/backup.sh / scripts/restore.sh 封装，宿主无需 pg_dump）：
  #       docker compose --profile backup run --rm pg-backup          # 备份到 ./backups/
  #       docker compose --profile backup run --rm pg-restore         # 恢复（DUMP_PATH 必填）
  pg-backup:
    profiles: ["backup"]
    image: postgres:16-alpine # 与主库同 tag：pg_dump/pg_restore 版本天然匹配
    environment: &pg-credentials
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    command:
      [
        "sh",
        "-c",
        "ts=$$(date -u +%Y%m%dT%H%M%SZ) && pg_dump -Fc -f /backups/qqlab-$$ts.dump && ls -lh /backups/qqlab-$$ts.dump",
      ]
    networks: [qqlab]
    restart: "no"

  pg-restore:
    profiles: ["backup"]
    image: postgres:16-alpine
    environment: *pg-credentials
    volumes:
      - ./backups:/backups:ro
    # --clean --if-exists：就地替换对象（dev/演练场景：migrate 先建好 schema 再灌数据）
    entrypoint:
      [
        "sh",
        "-c",
        "test -n \"$$DUMP_PATH\" || { echo 'DUMP_PATH 必填（容器内路径，如 /backups/qqlab-xxx.dump）' >&2; exit 2; }; pg_restore --clean --if-exists --no-owner -d \"$$PGDATABASE\" \"$$DUMP_PATH\" && echo restored: $$DUMP_PATH",
      ]
    networks: [qqlab]
    restart: "no"

networks:
  qqlab: {driver: bridge}

volumes:
  pg_data:
  redis_data:
  rabbit_data:
  minio_data:
  qlib_data:
  experiments:
  objects_data:
  casdoor_data: # Casdoor dev sqlite（阶段 7，仅 --profile casdoor）
  prometheus_data: # 指标时序库（阶段 8，仅 --profile monitor）
  alertmanager_data: # 告警状态/静默（阶段 9 · D 项，仅 --profile monitor）
  notify_sink: # 通知桥本地回执留档（阶段 9 · D 项）
  grafana_data: # Grafana sqlite/插件（阶段 9 · D 项，仅 --profile monitor）
  backend_venv: # API 侧（Python 3.12）
  worker_venv: # worker 侧（Python 3.11 + qlib）—— 与 API 分开，避免解释器串味
  frontend_node_modules:
